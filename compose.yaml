services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    environment:
        - REDIS_HOST=redis
        - REDIS_PORT=6379 
    depends_on:
      redis:
        condition: service_healthy 
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
    env_file: .env
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  redis_data:

